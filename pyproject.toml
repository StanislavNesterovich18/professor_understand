[project]
name = "bank-operation"
version = "0.1.0"
description = ""
authors = [
    { name = "S.Nesterovich" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.2,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = '''
/(
    \.venv|
    \.git|
    \.mypy_cache|
    \.pytest_cache|
    build|
    dist
)/
'''

[tool.isort]
line_length = 119
multi_line_output = 3


[tool.isort]
line_length = 119
multi_line_output = 3

[tool.mypy]
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = 'venv'


[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
